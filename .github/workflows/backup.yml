name: Sauvegarde base de données

# Sauvegarde hebdomadaire (et à la demande) de la base PostgreSQL de production :
# pg_dump au format custom, chiffré avec une phrase secrète, conservé 90 jours comme
# artefact GitHub. Ne fait rien tant que le secret DATABASE_URL_BACKUP est absent.
# Restauration : voir DEPLOIEMENT.md §6.
#
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   DATABASE_URL_BACKUP   = l'URL Neon (identique à DATABASE_URL de Render)
#   BACKUP_PASSPHRASE     = phrase longue et aléatoire (à garder hors GitHub : sans elle,
#                           l'archive est illisible)

on:
  schedule:
    - cron: "17 3 * * 1" # lundi 03:17 UTC
  workflow_dispatch:

jobs:
  dump:
    name: pg_dump chiffré → artefact (90 jours)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL_BACKUP: ${{ secrets.DATABASE_URL_BACKUP }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Secrets présents ?
        id: cfg
        run: |
          if [ -z "$DATABASE_URL_BACKUP" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL_BACKUP ou BACKUP_PASSPHRASE absent, pas de sauvegarde"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Installer pg_dump (même version majeure que le serveur)
        if: steps.cfg.outputs.present == 'true'
        # AUDIT §63 : « aborting because of server version mismatch » — le serveur (Neon) a changé de version majeure ;
        # le client est pris au dépôt PostgreSQL officiel dans la version du serveur, lue avant le dump.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          MAJOR=$(psql "$DATABASE_URL_BACKUP" -tAc "show server_version" | cut -d. -f1)
          echo "serveur PostgreSQL $MAJOR"
          if [ "$MAJOR" != "17" ]; then sudo apt-get install -y -qq "postgresql-client-$MAJOR" >/dev/null; fi
          export PATH="/usr/lib/postgresql/$MAJOR/bin:$PATH"
          echo "/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_PATH"
          pg_dump --version
      - name: Dump + chiffrement
        if: steps.cfg.outputs.present == 'true'
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          pg_dump "$DATABASE_URL_BACKUP" --format=custom --no-owner --no-privileges --file="trocoin-$STAMP.dump"
          SIZE=$(stat -c %s "trocoin-$STAMP.dump")
          echo "dump : $SIZE octets"
          if [ "$SIZE" -lt 1000 ]; then echo "::error::dump anormalement petit"; exit 1; fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "trocoin-$STAMP.dump" -out "trocoin-$STAMP.dump.enc" -pass env:BACKUP_PASSPHRASE
          rm -f "trocoin-$STAMP.dump"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
      - name: Vérifier que l'archive se déchiffre et se lit (pg_restore --list)
        if: steps.cfg.outputs.present == 'true'
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "trocoin-$STAMP.dump.enc" -out check.dump -pass env:BACKUP_PASSPHRASE
          pg_restore --list check.dump | grep -c "TABLE" | xargs -I{} echo "tables dans l'archive : {}"
          rm -f check.dump
      - name: Conserver l'artefact
        if: steps.cfg.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trocoin-db-${{ env.STAMP }}
          path: trocoin-${{ env.STAMP }}.dump.enc
          retention-days: 90
          if-no-files-found: error
