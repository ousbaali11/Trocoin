name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, tests e2e, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck (tsc)
        run: npx tsc -p tsconfig.json --noEmit
      - name: Tests e2e (SQLite en mémoire)
        run: npm test
      - name: Build de production
        run: npm run build
      - name: Vérifier la sortie du build (dist/main.js attendu par le Dockerfile)
        run: test -f dist/main.js && node -e "require('./dist/health/health.controller.js')" && echo OK
      - name: Audit des dépendances (échec si vulnérabilité ≥ haute)
        run: npm audit --audit-level=high

  api-postgres:
    name: API — tests e2e sur PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trocoin
          POSTGRES_PASSWORD: trocoin
          POSTGRES_DB: trocoin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trocoin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: trocoin
      DB_PASSWORD: trocoin
      DB_NAME: trocoin_test
      DB_SYNCHRONIZE: "false"
      E2E_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Migrations (schéma créé uniquement par les migrations)
        run: npm run migration:run
      - name: Tests e2e sur Postgres
        run: npm test

  frontend:
    name: Front — typecheck et next build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.trocoin.example
      NEXT_PUBLIC_SITE_URL: https://trocoin.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (tsc)
        run: npx tsc --noEmit -p tsconfig.json
      - name: next build (URL d'API de production injectée)
        run: npx next build
      - name: Audit des dépendances
        run: npm audit --audit-level=high

  docker:
    name: Image Docker de l'API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trocoin-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vérifier l'image (sharp/libvips chargeable, dist/main.js présent)
        run: docker run --rm trocoin-api:ci node -e "const s=require('sharp'); require('fs').accessSync('dist/main.js'); console.log('sharp', s.versions.sharp, 'vips', s.versions.vips)"

  # Scénarios utilisateur de bout en bout dans Chromium (Playwright), contre l'API COMPILÉE
  # (dist/main.js, SQLite jetable, fournisseurs simulés) et le front CONSTRUIT (next build + next start).
  # Un scénario en échec bloque le déploiement (deploy-render en dépend).
  e2e-navigateur:
    name: Parcours critiques (desktop + mobile 375 px)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      E2E_API_URL: http://localhost:3000
      E2E_FRONT_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Dépendances API
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Dépendances front
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
      - name: Build API (dist/main.js) et front (next build, URL d'API de test injectée)
        run: npm run e2e:build
      - name: Scénarios navigateur
        run: npx playwright test
      - name: Rapport et traces (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # Déploiement Render déclenché par la CI (remplace l'auto-deploy GitHub→Render jamais relié) :
  # ne s'exécute que si le secret RENDER_DEPLOY_HOOK existe (Render → Settings → Deploy Hook),
  # uniquement sur main, et seulement quand tout est vert. Puis attend que /health renvoie la
  # version du package.json poussé : preuve que le commit est bien en ligne.
  deploy-render:
    name: Déploiement Render (deploy hook) + preuve /health
    needs: [api, api-postgres, frontend, docker, e2e-navigateur]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://trocoin.onrender.com/health' }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret présent ?
        id: hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RENDER_DEPLOY_HOOK absent, pas de déploiement automatique (voir DEPLOIEMENT.md 2b)"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Déclencher le déploiement
        if: steps.hook.outputs.present == 'true'
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null -w 'hook Render, HTTP %{http_code}\n'
      - name: Attendre la mise en ligne de cette version
        if: steps.hook.outputs.present == 'true'
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          echo "Version attendue, $EXPECTED"
          for i in $(seq 1 60); do
            LIVE=$(curl -s -m 30 "$HEALTH_URL" | node -pe "try{JSON.parse(require('fs').readFileSync(0)).version}catch{''}")
            echo "[$i] version en ligne, $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Déployé et vérifié, $HEALTH_URL sert la version $EXPECTED"
              exit 0
            fi
            sleep 15
          done
          echo "::error::La version $EXPECTED n'est pas en ligne après 15 min (dernière vue, $LIVE)"
          exit 1
